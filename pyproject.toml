[project]
name = "production-change-risk-analyzer"
version = "0.1.0"
description = "AI-assisted infrastructure change risk analysis system"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.35.0",
    "pyyaml>=6.0",
    "click>=8.1",
    "rich>=13.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "moto[dynamodb,s3,sns]>=5.0",
]

[project.scripts]
risk-analyzer = "cli:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
