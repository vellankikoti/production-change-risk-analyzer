name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests & Evaluation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install uv
          uv venv .venv
          source .venv/bin/activate
          uv pip install -r requirements-dev.txt

      - name: Run unit tests
        run: |
          source .venv/bin/activate
          python -m pytest tests/ -v --tb=short --junitxml=test-results.xml

      - name: Run evaluation scenarios
        run: |
          source .venv/bin/activate
          python cli.py eval --json-output > eval-results.json
          python cli.py eval

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results.xml
            eval-results.json
