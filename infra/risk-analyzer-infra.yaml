AWSTemplateFormatVersion: "2010-09-09"
Description: Production Change Risk Analyzer — Infrastructure

Parameters:
  Environment:
    Type: String
    Default: dev

Resources:
  ReportsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "risk-analyzer-reports-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: risk_level
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: risk-level-index
          KeySchema:
            - AttributeName: risk_level
              KeyType: HASH
            - AttributeName: sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  EvidenceBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "risk-analyzer-evidence-${AWS::AccountId}-${Environment}"
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldEvidence
            Status: Enabled
            ExpirationInDays: 90
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  NotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "risk-analyzer-alerts-${Environment}"

Outputs:
  TableName:
    Value: !Ref ReportsTable
  BucketName:
    Value: !Ref EvidenceBucket
  TopicArn:
    Value: !Ref NotificationTopic
