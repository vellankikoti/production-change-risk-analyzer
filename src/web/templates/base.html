<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Risk Analyzer{% endblock %}</title>
    <style>
        :root {
            --bg: #0f1117;
            --surface: #1a1d29;
            --surface-2: #242836;
            --border: #2e3347;
            --text: #e4e6f0;
            --text-dim: #8b8fa3;
            --critical: #ef4444;
            --high: #f97316;
            --medium: #eab308;
            --low: #22c55e;
            --info: #3b82f6;
            --block: #ef4444;
            --review: #eab308;
            --approve: #22c55e;
            --accent: #6366f1;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
        }
        .container { max-width: 1280px; margin: 0 auto; padding: 0 24px; }
        nav {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 16px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        nav .container {
            display: flex;
            align-items: center;
            gap: 32px;
        }
        nav .logo {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent);
            text-decoration: none;
        }
        nav a {
            color: var(--text-dim);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            padding: 6px 12px;
            border-radius: 6px;
            transition: all 0.15s;
        }
        nav a:hover, nav a.active {
            color: var(--text);
            background: var(--surface-2);
        }
        main { padding: 32px 0; }
        h1 { font-size: 24px; font-weight: 700; margin-bottom: 24px; }
        h2 { font-size: 18px; font-weight: 600; margin-bottom: 16px; }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 16px;
        }
        .grid { display: grid; gap: 16px; }
        .grid-4 { grid-template-columns: repeat(4, 1fr); }
        .grid-3 { grid-template-columns: repeat(3, 1fr); }
        .grid-2 { grid-template-columns: repeat(2, 1fr); }
        @media (max-width: 768px) {
            .grid-4, .grid-3, .grid-2 { grid-template-columns: 1fr; }
        }
        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }
        .stat-value {
            font-size: 36px;
            font-weight: 800;
            line-height: 1.1;
        }
        .stat-label {
            font-size: 13px;
            color: var(--text-dim);
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .badge-critical { background: rgba(239,68,68,0.15); color: var(--critical); }
        .badge-high { background: rgba(249,115,22,0.15); color: var(--high); }
        .badge-medium { background: rgba(234,179,8,0.15); color: var(--medium); }
        .badge-low { background: rgba(34,197,94,0.15); color: var(--low); }
        .badge-block { background: rgba(239,68,68,0.15); color: var(--block); }
        .badge-review { background: rgba(234,179,8,0.15); color: var(--review); }
        .badge-approve { background: rgba(34,197,94,0.15); color: var(--approve); }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        th {
            text-align: left;
            padding: 12px 16px;
            border-bottom: 2px solid var(--border);
            color: var(--text-dim);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
        }
        tr:hover td { background: var(--surface-2); }
        a.report-link { color: var(--accent); text-decoration: none; font-weight: 600; }
        a.report-link:hover { text-decoration: underline; }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.15s;
            text-decoration: none;
        }
        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover { background: #5558e6; }
        .btn-secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
        .btn-secondary:hover { background: var(--border); }
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .form-group select,
        .form-group input[type="text"] {
            width: 100%;
            padding: 10px 14px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 14px;
        }
        .form-group input[type="file"] {
            padding: 10px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 14px;
            width: 100%;
        }
        .form-row { display: flex; gap: 16px; }
        .form-row .form-group { flex: 1; }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }
        .score-bar {
            width: 100%;
            height: 8px;
            background: var(--surface-2);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 8px;
        }
        .score-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.5s ease;
        }
        .empty-state {
            text-align: center;
            padding: 48px;
            color: var(--text-dim);
        }
        .risk-chart {
            display: flex;
            gap: 4px;
            align-items: flex-end;
            height: 80px;
            margin-top: 12px;
        }
        .risk-bar {
            flex: 1;
            border-radius: 4px 4px 0 0;
            min-height: 4px;
            transition: height 0.3s;
        }
        .alert {
            padding: 16px 20px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
        }
        .alert-error { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: var(--critical); }
        .alert-success { background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.3); color: var(--approve); }
        .section { margin-bottom: 32px; }
        .section-title {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-dim);
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }
        .fact-item, .inference-item {
            padding: 8px 12px;
            margin-bottom: 4px;
            border-radius: 6px;
            font-size: 14px;
        }
        .fact-item { background: rgba(34,197,94,0.08); border-left: 3px solid var(--low); }
        .inference-item { background: rgba(99,102,241,0.08); border-left: 3px solid var(--accent); }
    </style>
</head>
<body>
    <nav>
        <div class="container">
            <a href="/" class="logo">Risk Analyzer</a>
            <a href="/">Dashboard</a>
            <a href="/analyze">Analyze</a>
        </div>
    </nav>
    <main>
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>
</body>
</html>
